vnfd:
  id: gateway_vnfd
  product-name: gateway_vnfd
  description: "Unified OVS/VXLAN Gateway for Branch 1 and 2"
  version: "1.0"
  mgmt-cp: cp-mgmt
  
  # --- Hardware Resources ---
  virtual-compute-desc:
    - id: gateway-compute
      virtual-cpu:
        num-virtual-cpu: 1
      virtual-memory:
        size: 1

  virtual-storage-desc:
    - id: gateway-storage
      size-of-storage: 5

  sw-image-desc:
    - id: ubuntu20
      name: ubuntu20
      image: ubuntu20

  # --- Virtual Deployment Unit ---
  vdu:
    - id: gateway-vdu
      name: gateway-vdu
      sw-image-desc: ubuntu20
      virtual-compute-desc: gateway-compute
      virtual-storage-desc:
        - gateway-storage
      int-cpd:
        - id: cp-mgmt-int  # Management interface
          virtual-network-interface-requirement:
            - name: eth0
              virtual-interface: {type: VIRTIO}
        - id: cp-lan-ext  # Maps to eth1 (lan11/lan21)
          virtual-network-interface-requirement:
            - name: eth1
              virtual-interface: {type: VIRTIO}
        - id: cp-lan-int  # Maps to eth2 (lan12/lan22)
          virtual-network-interface-requirement:
            - name: eth2
              virtual-interface: {type: VIRTIO}
        - id: cp-access   # Maps to eth3 (AccessNet1/AccessNet2)
          virtual-network-interface-requirement:
            - name: eth3
              virtual-interface: {type: VIRTIO}
      
      cloud-init: |
        #cloud-config
        users:
          - name: ubuntu
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash
            ssh_authorized_keys:
              - ssh-rsa  upm@vnxlab
        runcmd:
          - service openvswitch-switch start
          - sleep 5
          - ifconfig eth1 up
          - ifconfig eth2 up
          
          # WAN Bridge & VXLAN 1 Configuration
          - ovs-vsctl add-br brwan
          - ip link add vxlan1 type vxlan id 1 remote {{ remote_ip }} dstport 4789 dev eth3
          - ovs-vsctl add-port brwan eth1
          - ovs-vsctl add-port brwan vxlan1
          - ifconfig vxlan1 up
          
          # Internal Bridge & VXLAN 2 Configuration
          - ovs-vsctl add-br brint
          - ip link add vxlan2 type vxlan id 2 remote {{ remote_ip }} dstport 8742 dev eth3
          - ovs-vsctl add-port brint eth2
          - ovs-vsctl add-port brint vxlan2
          - ifconfig vxlan2 up

  df:
    - id: default-df
      vdu-profile:
        - id: gateway-vdu
          min-number-of-instances: 1
      instantiation-level:
        - id: default-level
          vdu-level:
            - vdu-id: gateway-vdu
              number-of-instances: 1
      default-instantiation-level: default-level

  # --- External Connection Points (For NSD mapping) ---
  ext-cpd:
    - id: cp-mgmt
      int-cpd: {vdu-id: gateway-vdu, cpd: cp-mgmt-int}
    - id: cp-lan-ext
      int-cpd: {vdu-id: gateway-vdu, cpd: cp-lan-ext}
    - id: cp-lan-int
      int-cpd: {vdu-id: gateway-vdu, cpd: cp-lan-int}
    - id: cp-access
      int-cpd: {vdu-id: gateway-vdu, cpd: cp-access}

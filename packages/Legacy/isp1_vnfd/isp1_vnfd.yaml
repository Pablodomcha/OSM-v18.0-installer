vnfd:
  id: r1_vnfd
  product-name: isp_vnfd
  description: ISP VNF with NAT and Internet routing
  version: "1.0"
  mgmt-cp: cp-mgmt

  virtual-compute-desc:
    - id: r1-compute
      virtual-cpu:
        num-virtual-cpu: 1
      virtual-memory:
        size: 1

  virtual-storage-desc:
    - id: r1-storage
      size-of-storage: 5

  sw-image-desc:
    - id: ubuntu20
      name: ubuntu20
      image: ubuntu20

  vdu:
    - id: isp-vdu
      name: isp-vdu
      sw-image-desc: ubuntu20
      virtual-compute-desc: isp-compute
      virtual-storage-desc:
        - isp-storage
      int-cpd:
        - id: cp-mgmt # Management
          virtual-network-interface-requirement:
            - name: eth0
              virtual-interface:
                type: VIRTIO
        - id: cp-int
          virtual-network-interface-requirement:
            - name: eth1
              virtual-interface:
                type: VIRTIO
        - id: cp-ext
          virtual-network-interface-requirement:
            - name: eth2
              virtual-interface:
                type: VIRTIO
      
      # Cloud-init to handle IP forwarding and routing from the XML
      cloud-init-file: isp1_cloud_init.cfg

  df:
    - id: default-df
      vdu-profile:
        - id: isp1-vdu
          min-number-of-instances: 1
      instantiation-level:
        - id: default-level
          vdu-level:
            - vdu-id: isp1-vdu
              number-of-instances: 1
      default-instantiation-level: default-level

  ext-cpd:
    - id: cp-mgmt
      int-cpd:
        vdu-id: isp1-vdu
        cpd: eth0-int
    - id: cp-int
      int-cpd:
        vdu-id: isp1-vdu
        cpd: eth1-int
    - id: cp-ext
      int-cpd:
        vdu-id: isp1-vdu
        cpd: cp-ext

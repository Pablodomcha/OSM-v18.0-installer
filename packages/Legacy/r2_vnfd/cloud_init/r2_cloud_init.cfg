#cloud-config
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  upm@vnxlab
runcmd:
  - sysctl -w net.ipv4.ip_forward=1
  - ifconfig eth1 10.20.2.1 netmask 255.255.255.0 mtu 1400
  - ifconfig eth2 10.20.0.2 netmask 255.255.255.0
  - ifconfig eth3 192.168.255.253 netmask 255.255.255.0
  - ip route add 10.20.1.0/24 via 10.20.0.1
  - ip route add default via 192.168.255.254

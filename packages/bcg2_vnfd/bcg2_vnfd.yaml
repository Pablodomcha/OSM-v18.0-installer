vnfd:
  id: bcg2_vnfd
  product-name: bcg2_vnfd
  description: Bridge Customer Gateway based on VNX sdedge_nfv
  version: "1.0"
  mgmt-cp: cp-mgmt
  virtual-compute-desc:
    - id: bcg-compute
      virtual-cpu:
        num-virtual-cpu: 1
      virtual-memory:
        size: 1 # Use integer 1 instead of 1.0
  virtual-storage-desc:
    - id: bcg-storage
      size-of-storage: 5  # Size in GB
  sw-image-desc:
    - id: ubuntu20
      name: ubuntu20
      image: ubuntu20
  vdu:
    - id: bcg-vdu
      name: bcg-vdu
      sw-image-desc: ubuntu20
      virtual-compute-desc: bcg-compute
      virtual-storage-desc:
        - bcg-storage
      int-cpd:
        - id: eth0-int
          virtual-network-interface-requirement:
            - name: eth0
              virtual-interface:
                type: VIRTIO # Explicitly define the interface type
        - id: eth1-int
          virtual-network-interface-requirement:
            - name: eth1
              virtual-interface:
                type: VIRTIO
        - id: eth2-int
          virtual-network-interface-requirement:
            - name: eth2
              virtual-interface:
                type: VIRTIO
        - id: eth3-int
          virtual-network-interface-requirement:
            - name: eth3
              virtual-interface:
                type: VIRTIO
      cloud-init-file: bcg2_cloud_init.cfg
  df:
    - id: default-df
      vdu-profile:
        - id: bcg-vdu
          min-number-of-instances: 1
      instantiation-level:
        - id: default-level
          vdu-level:
            - vdu-id: bcg-vdu
              number-of-instances: 1
      default-instantiation-level: default-level
  ext-cpd:
    - id: cp-mgmt
      int-cpd:
        vdu-id: bcg-vdu
        cpd: eth0-int
    - id: cp-lan21
      int-cpd:
        vdu-id: bcg-vdu
        cpd: eth1-int
    - id: cp-lan22
      int-cpd:
        vdu-id: bcg-vdu
        cpd: eth2-int
    - id: cp-access2
      int-cpd:
        vdu-id: bcg-vdu
        cpd: eth3-int

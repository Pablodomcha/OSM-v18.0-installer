vnfd:
  id: host_vnfd  # No quotes
  product-name: host_vnfd
  description: Generic Ubuntu host for lan1 (h1/t1)
  version: "1.0"
  mgmt-cp: cp-mgmt

  virtual-compute-desc:
    - id: host-compute
      virtual-cpu:
        num-virtual-cpu: 1
      virtual-memory:
        size: 1

  virtual-storage-desc:
    - id: host-storage
      size-of-storage: 5

  sw-image-desc:
    - id: ubuntu20
      name: ubuntu20

  vdu:
    - id: host-vdu
      name: host-vdu
      sw-image-desc: ubuntu20
      virtual-compute-desc: host-compute
      virtual-storage-desc:
        - host-storage
      int-cpd:
        - id: eth0-int # Management
          virtual-network-interface-requirement:
            - name: eth0
              virtual-interface:
                type: VIRTIO
        - id: eth1-int # Connection to lan1
          virtual-network-interface-requirement:
            - name: eth1
              virtual-interface:
                type: VIRTIO
      
      cloud-init-file: host_cloud_init.cfg

  df:
    - id: default-df
      vdu-profile:
        - id: host-vdu
          min-number-of-instances: 1
      instantiation-level:
        - id: default-level
          vdu-level:
            - vdu-id: host-vdu
              number-of-instances: 1
      default-instantiation-level: default-level

  ext-cpd:
    - id: cp-mgmt
      int-cpd:
        vdu-id: host-vdu
        cpd: eth0-int
    - id: cp-lan
      int-cpd:
        vdu-id: host-vdu
        cpd: eth1-int

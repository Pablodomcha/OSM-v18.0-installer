vnfd:
  id: isp_vnfd
  product-name: isp_vnfd
  description: "Unified ISP VNF with NAT and Internet Routing"
  version: "1.0"
  mgmt-cp: cp-mgmt

  # --- Hardware Resources ---
  virtual-compute-desc:
    - id: isp-compute
      virtual-cpu:
        num-virtual-cpu: 1
      virtual-memory:
        size: 1

  virtual-storage-desc:
    - id: isp-storage
      size-of-storage: 5

  sw-image-desc:
    - id: ubuntu20
      name: ubuntu20
      image: ubuntu20

  # --- Virtual Deployment Unit ---
  vdu:
    - id: isp-vdu
      name: isp-vdu
      sw-image-desc: ubuntu20
      virtual-compute-desc: isp-compute
      virtual-storage-desc:
        - isp-storage
      int-cpd:
        - id: cp-ext      # Maps to eth1 (ExtNet1 or ExtNet2)
          virtual-network-interface-requirement:
            - name: eth1
              virtual-interface: {type: VIRTIO}
        - id: cp-int      # Maps to eth2 (Internet network)
          virtual-network-interface-requirement:
            - name: eth2
              virtual-interface: {type: VIRTIO}
        - id: cp-mgmt     # Maps to eth9 (NAT source / virbr0)
          virtual-network-interface-requirement:
            - name: eth9
              virtual-interface: {type: VIRTIO}
      
      cloud-init: |
        #cloud-config
        users:
          - name: ubuntu
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash
            ssh_authorized_keys:
              - ssh-rsa  upm@vnxlab
        runcmd:
          # Enable IP Forwarding as per XML
          - sysctl -w net.ipv4.ip_forward=1
          
          # Setup NAT/Masquerading on eth9 as per XML
          - sleep 2
          - dhclient eth9
          - iptables -t nat -A POSTROUTING -o eth9 -j MASQUERADE
          
          # Parameterized routing to reach the other ISP
          - ip route add {{ remote_isp_net }} via {{ next_hop_ip }}

  df:
    - id: default-df
      vdu-profile:
        - id: isp-vdu
          min-number-of-instances: 1
      instantiation-level:
        - id: default-level
          vdu-level:
            - vdu-id: isp-vdu
              number-of-instances: 1
      default-instantiation-level: default-level

  # --- External Connection Points ---
  ext-cpd:
    - id: cp-mgmt
      int-cpd: {vdu-id: isp-vdu, cpd: cp-mgmt}
    - id: cp-ext
      int-cpd: {vdu-id: isp-vdu, cpd: cp-ext}
    - id: cp-int
      int-cpd: {vdu-id: isp-vdu, cpd: cp-int}

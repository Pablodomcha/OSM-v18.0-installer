vnfd:
  id: router_vnfd
  product-name: router_vnfd
  description: "Unified Router for Branch 1 and 2"
  version: "1.0"
  mgmt-cp: cp-mgmt

  # --- Hardware Resources ---
  virtual-compute-desc:
    - id: router-compute
      virtual-cpu:
        num-virtual-cpu: 1
      virtual-memory:
        size: 1

  virtual-storage-desc:
    - id: router-storage
      size-of-storage: 5

  sw-image-desc:
    - id: ubuntu20
      name: ubuntu20
      image: ubuntu20

  # --- Virtual Deployment Unit ---
  vdu:
    - id: router-vdu
      name: router-vdu
      sw-image-desc: ubuntu20
      virtual-compute-desc: router-compute
      virtual-storage-desc:
        - router-storage
      int-cpd:
        - id: cp-mgmt-int
          virtual-network-interface-requirement:
            - name: eth0
              virtual-interface: {type: VIRTIO}
        - id: cp-lan-int
          virtual-network-interface-requirement:
            - name: eth1
              virtual-interface: {type: VIRTIO}
        - id: cp-p2p-int
          virtual-network-interface-requirement:
            - name: eth2
              virtual-interface: {type: VIRTIO}
        - id: cp-wan-int
          virtual-network-interface-requirement:
            - name: eth3
              virtual-interface: {type: VIRTIO}
      
      cloud-init: |
        #cloud-config
        users:
          - name: ubuntu
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash
            ssh_authorized_keys:
              - ssh-rsa  upm@vnxlab
        runcmd:
          - sysctl -w net.ipv4.ip_forward=1
          - ifconfig eth1 mtu 1400
          - sed -i -e '/iface eth1 inet static/a \   mtu 1400' /etc/network/interfaces
          - ip route add {{ remote_branch_subnet }} via {{ p2p_next_hop }}
          - ip route add default via {{ internet_gw }}

  df:
    - id: default-df
      vdu-profile:
        - id: router-vdu
          min-number-of-instances: 1
      instantiation-level:
        - id: default-level
          vdu-level:
            - vdu-id: router-vdu
              number-of-instances: 1
      default-instantiation-level: default-level

  # --- External Connection Points ---
  ext-cpd:
    - id: cp-mgmt
      int-cpd: {vdu-id: router-vdu, cpd: cp-mgmt-int}
    - id: cp-lan
      int-cpd: {vdu-id: router-vdu, cpd: cp-lan-int}
    - id: cp-p2p
      int-cpd: {vdu-id: router-vdu, cpd: cp-p2p-int}
    - id: cp-wan
      int-cpd: {vdu-id: router-vdu, cpd: cp-wan-int}

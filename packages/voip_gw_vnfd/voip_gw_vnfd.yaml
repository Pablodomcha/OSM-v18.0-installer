vnfd:
  id: voip_gw_vnfd
  product-name: voip_gw_vnfd
  description: "VoIP Gateway for MPLS WAN"
  version: "1.0"
  mgmt-cp: cp-mgmt

  # --- Hardware Resources ---
  virtual-compute-desc:
    - id: voip-compute
      virtual-cpu:
        num-virtual-cpu: 1
      virtual-memory:
        size: 1

  virtual-storage-desc:
    - id: voip-storage
      size-of-storage: 5

  sw-image-desc:
    - id: ubuntu20
      name: ubuntu20
      image: ubuntu20

  # --- Virtual Deployment Unit ---
  vdu:
    - id: voip-vdu
      name: voip-vdu
      sw-image-desc: ubuntu20
      virtual-compute-desc: voip-compute
      virtual-storage-desc:
        - voip-storage
      int-cpd:
        - id: cp-mgmt-int
          virtual-network-interface-requirement:
            - name: eth0
              virtual-interface: {type: VIRTIO}
        - id: cp-mpls-int # Maps to eth1 in XML
          virtual-network-interface-requirement:
            - name: eth1
              virtual-interface: {type: VIRTIO}
      
      cloud-init: |
        #cloud-config
        users:
          - name: ubuntu
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash
            ssh_authorized_keys:
              - ssh-rsa  upm@vnxlab
        runcmd:
          # Enable IP Forwarding as per XML
          - sysctl -w net.ipv4.ip_forward=1
          
          # Specific routes from XML
          - ip route add 10.20.1.0/24 via 10.20.0.1
          - ip route add 10.20.2.0/24 via 10.20.0.2

  df:
    - id: default-df
      vdu-profile:
        - id: voip-vdu
          min-number-of-instances: 1
      instantiation-level:
        - id: default-level
          vdu-level:
            - vdu-id: voip-vdu
              number-of-instances: 1
      default-instantiation-level: default-level

  # --- External Connection Points ---
  ext-cpd:
    - id: cp-mgmt
      int-cpd: {vdu-id: voip-vdu, cpd: cp-mgmt-int}
    - id: cp-mpls
      int-cpd: {vdu-id: voip-vdu, cpd: cp-mpls-int}

vnfd:
  id: s_vnfd
  product-name: s_vnfd
  description: "External Server s1 on Internet network"
  version: "1.0"
  mgmt-cp: cp-mgmt

  # --- Hardware Resources ---
  virtual-compute-desc:
    - id: s1-compute
      virtual-cpu:
        num-virtual-cpu: 1
      virtual-memory:
        size: 1

  virtual-storage-desc:
    - id: s1-storage
      size-of-storage: 5

  sw-image-desc:
    - id: ubuntu20
      name: ubuntu20
      image: ubuntu20

  # --- Virtual Deployment Unit ---
  vdu:
    - id: s1-vdu
      name: s1-vdu
      sw-image-desc: ubuntu20
      virtual-compute-desc: s1-compute
      virtual-storage-desc:
        - s1-storage
      int-cpd:
        - id: cp-mgmt-int
          virtual-network-interface-requirement:
            - name: eth0
              virtual-interface: {type: VIRTIO}
        - id: cp-int-int # Maps to eth1 in XML
          virtual-network-interface-requirement:
            - name: eth1
              virtual-interface: {type: VIRTIO}
      
      cloud-init: |
        #cloud-config
        users:
          - name: ubuntu
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash
            ssh_authorized_keys:
              - ssh-rsa  upm@vnxlab
        runcmd:
          # Routing logic from XML
          - ip route add 10.100.1.0/24 via 10.100.3.1
          - ip route add 10.100.2.0/24 via 10.100.3.2
          - ip route add default via 10.100.3.1

  df:
    - id: default-df
      vdu-profile:
        - id: s1-vdu
          min-number-of-instances: 1
      instantiation-level:
        - id: default-level
          vdu-level:
            - vdu-id: s1-vdu
              number-of-instances: 1
      default-instantiation-level: default-level

  # --- External Connection Points ---
  ext-cpd:
    - id: cp-mgmt
      int-cpd: {vdu-id: s1-vdu, cpd: cp-mgmt-int}
    - id: cp-int
      int-cpd: {vdu-id: s1-vdu, cpd: cp-int-int}

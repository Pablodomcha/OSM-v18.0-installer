# instantiate-web.yaml
vnf:
  - member-vnf-index: webserver
    vdu:
      - id: webserver-vdu
        interface:
          - name: eth1
            ip-address: 10.100.3.4

# This maps the NSD's virtual link descriptor to the physical OpenvSwitch net
vld:
  - name: internet-net
    vim-network-name: Internet
    # If your version needs IP tracking parameters on the link level:
    ip-profile:
      ip-version: ipv4
      subnet-address: 10.100.3.0/24
      gateway-address: 10.100.3.1
